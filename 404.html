<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | Bulk Growth</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<style>
:root{--ink:#07111f;--line:#283548;--text:#fff;--muted:#93a1b8;--lime:#a6ff00;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--ink);color:var(--text);font-family:Inter,"Segoe UI",Arial,sans-serif;text-align:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
main{display:grid;gap:18px;justify-items:center;max-width:32rem}
img{width:180px;height:auto}
h1{font-size:clamp(1.8rem,6vw,2.6rem);margin:0;text-transform:uppercase;letter-spacing:-.01em}
p{color:var(--muted);margin:0;line-height:1.6}
a{display:inline-block;margin-top:8px;padding:.8rem 1.3rem;border-radius:10px;background:var(--lime);color:var(--ink);font-weight:600;text-decoration:none}
a:focus-visible{outline:2px solid var(--lime);outline-offset:3px}
</style>
</head>
<body>
<main>
  <img src="/images/bulk-growth-logo-stacked.webp" alt="Bulk Growth" width="190" height="146">
  <h1>Page not found</h1>
  <p>This page doesn't exist or has moved. Head back to the homepage to see our services, results and how to reach us.</p>
  <a href="/">Back to homepage</a>
</main>
</body>
</html>
